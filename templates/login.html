{% extends "layout.html" %}

{% block body %}

    <h1>Log In</h1>

    {% if error %}
        {{ error }}
    {% endif %}

    <form action="/login" method="post">

        <input
            autocomplete="off"
            autofocus
            name="email"
            placeholder="Email"
            type="email"
            required>

        <input
            name="password"
            placeholder="Password"
            type="password"
            required>

        <button type="submit">Log In</button>

    </form>

{% endblock %}
